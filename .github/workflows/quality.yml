name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Report dependency audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a = require("./npm-audit.json"); const v = a.metadata?.vulnerabilities; console.log("Backend full dependency audit:", JSON.stringify(v || a.error || {}, null, 2));'
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e 'const a = require("./npm-audit-production.json"); const v = a.metadata?.vulnerabilities; const findings = Object.entries(a.vulnerabilities || {}).map(([name, item]) => ({name, severity:item.severity, range:item.range, fixAvailable:item.fixAvailable, via:item.via})); console.log("Backend production dependency audit:", JSON.stringify({summary:v || a.error || {}, findings}, null, 2)); if (!v) { console.error("Production dependency audit did not return a vulnerability summary."); process.exit(1); } if (v.critical > 0 || v.high > 0) process.exit(1); if (v.moderate > 0) console.warn("Moderate production dependency findings remain.");'
      - name: Run unit tests
        run: npm test

  frontend-quality:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Report dependency audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a = require("./npm-audit.json"); const v = a.metadata?.vulnerabilities; console.log("Frontend full dependency audit:", JSON.stringify(v || a.error || {}, null, 2));'
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e 'const a = require("./npm-audit-production.json"); const v = a.metadata?.vulnerabilities; const findings = Object.entries(a.vulnerabilities || {}).map(([name, item]) => ({name, severity:item.severity, range:item.range, fixAvailable:item.fixAvailable, via:item.via})); console.log("Frontend production dependency audit:", JSON.stringify({summary:v || a.error || {}, findings}, null, 2)); if (!v) { console.error("Production dependency audit did not return a vulnerability summary."); process.exit(1); } if (v.critical > 0 || v.high > 0) process.exit(1); if (v.moderate > 0) console.warn("Moderate production dependency findings remain.");'
      - name: Run ESLint
        run: npm run lint
      - name: Build production application
        run: npm run build
