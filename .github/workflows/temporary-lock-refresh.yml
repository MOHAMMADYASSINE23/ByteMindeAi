name: Temporary lockfile refresh

on:
  push:
    branches: [security/patch-server-dev-dependencies]

permissions:
  contents: write

concurrency:
  group: temporary-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Refresh server lockfile
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Refresh frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated lockfiles
        run: |
          if git diff --quiet -- server/package-lock.json frontend/package-lock.json; then
            echo "Lockfiles already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json frontend/package-lock.json
          git commit -m "chore: refresh lockfiles for patched dependencies"
          git push origin HEAD:${{ github.ref_name }}
