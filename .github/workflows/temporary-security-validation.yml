name: Temporary security validation

on:
  push:
    branches: [ci/dependency-audit-refresh]

permissions:
  contents: read

concurrency:
  group: temporary-security-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/library
  AUTH_SECRET: ci-only-placeholder-secret-not-for-production
  NEXTAUTH_SECRET: ci-only-placeholder-secret-not-for-production
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_API_ENDPOINT: http://localhost:3000
  NEXT_PUBLIC_PROD_API_ENDPOINT: https://example.com
  NEXT_PUBLIC_IMAGEKIT_PUBLIC_KEY: ci-public-key
  NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: https://ik.imagekit.io/example
  IMAGEKIT_PRIVATE_KEY: ci-private-key-placeholder
  UPSTASH_REDIS_URL: https://example.upstash.io
  UPSTASH_REDIS_TOKEN: ci-upstash-token-placeholder
  QSTASH_URL: https://qstash.upstash.io
  QSTASH_TOKEN: ci-qstash-token-placeholder
  EMAILJS_SERVICE_ID: ci-email-service
  EMAILJS_TEMPLATE_ID: ci-email-template
  EMAILJS_PUBLIC_KEY: ci-email-public-key
  EMAILJS_PRIVATE_KEY: ci-email-private-key
  RESEND_TOKEN: ci-resend-token-placeholder

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Audit backend dependencies
        run: |
          npm audit --json > npm-audit.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e 'const a=require("./npm-audit.json"); console.log("Backend full audit:", JSON.stringify(a.metadata?.vulnerabilities || a.error || {}));'
          node -e 'const a=require("./npm-audit-production.json"); const v=a.metadata?.vulnerabilities; console.log("Backend production audit:", JSON.stringify({summary:v || a.error || {}, findings:Object.entries(a.vulnerabilities || {}).map(([name,x])=>({name,severity:x.severity,range:x.range,fixAvailable:x.fixAvailable}))},null,2)); if(v?.critical>0) process.exit(1);'
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Audit frontend dependencies
        run: |
          npm audit --json > npm-audit.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e 'const a=require("./npm-audit.json"); console.log("Frontend full audit:", JSON.stringify(a.metadata?.vulnerabilities || a.error || {}));'
          node -e 'const a=require("./npm-audit-production.json"); const v=a.metadata?.vulnerabilities; console.log("Frontend production audit:", JSON.stringify({summary:v || a.error || {}, findings:Object.entries(a.vulnerabilities || {}).map(([name,x])=>({name,severity:x.severity,range:x.range,fixAvailable:x.fixAvailable}))},null,2)); if(v?.critical>0) process.exit(1);'
      - run: npm run lint
      - run: npm run build
